# User settings

seed: null  # null = unset

# Compute
device: auto  # auto = the available accelerator
n_workers: 0

# Checkpointing
checkpoint_every: 100
load: 0  # 0 = start from scratch, -1 = the latest checkpoint
run_id: null  # null = the last run

# Trackers
trackers:
  hydra: true
  sqlalchemy: true
  plotly: true

# Plotting
plot:
  show: false
  sample_indices: []  # empty = the misclassified clouds
