[project]
name = "PointCloudCounterfactual"
version = "3.0"
description = "Counterfactual explanations for point cloud classifiers."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "drytorch>=0.1.0",
    "h5py>=3.16.0",
    "hydra-core>=1.3.2",
    "numpy>=2.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pykeops>=2.2.3",
    "requests>=2.28.1",
    "scipy>=1.18.0",
    "torch~=2.14.0",
    "tqdm>=4.66.5",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
emd = ["structural-losses"]
track_all = [
    "plotly>=7.1.0",
    "sqlalchemy>=2.0.0",
]
visualize = ["pyvista>=0.46.4"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "ruff==0.17.1",
    "setuptools>=68.0.0",
]

[tool.basedpyright]
exclude = ["external", "experiments", "outputs", "tests", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.uv.sources]
structural-losses = { path = "external/pytorch_structural_losses" }
